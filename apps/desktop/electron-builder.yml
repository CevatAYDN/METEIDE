# The Windows installer (docs/15, builds; ADR-115): electron-builder over a staging folder that
# `pnpm deploy` fills, so the app ships a real node_modules tree instead of pnpm's links.
# Build it with `pnpm --filter @mete/desktop package:win`.
appId: ide.mete.app
productName: METE IDE
# The staged package.json carries production dependencies only, so the Electron version is named here.
electronVersion: 42.11.12
directories:
  output: dist/installer
# Theia loads native modules and spawns from the app folder, so nothing is archived.
asar: false
# better-sqlite3, node-pty, native-keymap, drivelist and @vscode/windows-ca-certs are rebuilt for
# Electron's ABI (docs/15, builds).
npmRebuild: true
files:
  - lib/**
  - plugins/**
  - package.json
  - "!**/*.map"
  # `pnpm deploy` copies workspace packages whole, ignoring their `files` field; keep sources,
  # tests and coverage out of the installer (docs/15, builds).
  - "!**/node_modules/@mete/*/src/**"
  - "!**/node_modules/@mete/*/test/**"
  - "!**/node_modules/@mete/*/coverage/**"
  - "!**/node_modules/@mete/*/.turbo/**"
  - "!**/node_modules/@mete/*/tsconfig*.json"
  - "!**/node_modules/@mete/*/tsconfig.tsbuildinfo"
  - "!**/node_modules/@mete/*/vitest*.config.ts"
# The CLI finds these beside the app in a packaged build (ADR-115): extraResources land in
# resources/. package-win.mjs copies the repository's folders into the staging project root, which
# is what electron-builder resolves these paths against.
extraResources:
  - from: templates
    to: templates
  - from: adapters
    to: adapters
win:
  # The METE IDE icon (a 1024 px PNG); electron-builder turns it into the .ico it embeds.
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # No space: GitHub turns one in an asset name into a dot, while latest.yml names the file with a
  # dash, so the updater would ask the release for a file it does not hold (ADR-137).
  artifactName: METE-IDE-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Where electron-updater looks for a newer release (docs/15, release process, step 6; ADR-137):
# electron-builder writes it into the app as app-update.yml and writes latest.yml beside the
# installer for step 5 to upload. package-win.mjs never publishes; step 5 does.
publish:
  provider: github
  owner: CevatAYDN
  repo: METEIDE
