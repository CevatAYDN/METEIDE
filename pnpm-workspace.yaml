packages:
  - apps/*
  - packages/*
# Install scripts run only for the packages that say true: the Theia packages whose .node files the
# desktop bundle copies (drivelist, native-keymap, @theia/ffmpeg). Electron stays false because the
# Theia CLI runs its install.js itself (theia build).
allowBuilds:
  "@parcel/watcher": false
  "@theia/ffmpeg": true
  better-sqlite3: false
  drivelist: true
  electron: false
  esbuild: false
  keytar: false
  lefthook: true
  msgpackr-extract: false
  native-keymap: true
  puppeteer: false
# The generated Theia application imports every Theia extension by name and expects them hoisted;
# pnpm's strict layout hides the ones that are only dependencies of other extensions (apps/desktop).
publicHoistPattern:
  - "@theia/*"
  - "@parcel/*"
  - drivelist
  - native-keymap
  - reflect-metadata
  - trash
# docs/05: a release younger than 14 days MUST NOT be adopted (20160 minutes).
minimumReleaseAge: 20160
# Security overrides (the audit of 2026-10-23), each at least 14 days old as docs/05 requires:
# Electron >= 42.11.9 closes the sandbox, protocol-handler and code-cache advisories of 42.8.1 (Theia
# 1.76 pins 42.8.1 as a peer; a patch release of the same major is accepted); serialize-javascript
# >= 7.0.3 (mocha, through @theia/cli) closes an RCE in its deserializer. dompurify 3.4.17 and
# markdown-it 14.3.3 (Theia's markdown view) close critical and high advisories but are younger than
# 14 days on that date: adopt them on 2026-10-26 and 2026-10-30. decompress (theia download:plugins,
# never run here) has no fixed release.
overrides:
  electron: 42.11.12
  serialize-javascript: ^7.1.2
