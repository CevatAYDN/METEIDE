packages:
  - apps/*
  - packages/*
# Install scripts run only for the packages that say true: the Theia packages whose .node files the
# desktop bundle copies (drivelist, native-keymap, @theia/ffmpeg) and node-pty, whose prebuild the
# terminal loads. Electron stays false because the Theia CLI runs its install.js itself (theia build).
# @vscode/windows-ca-certs compiles too: the extension host's proxy agent requires it on Windows
# (N-API, so the same binary runs in Node and Electron); @theia/bundle-plugin resolves its .node from
# the hoisted root.
allowBuilds:
  "@parcel/watcher": false
  "@theia/ffmpeg": true
  "@vscode/windows-ca-certs": true
  better-sqlite3: false
  drivelist: true
  electron: false
  # electron-builder pulls Squirrel's installer helper for a target METE does not build (NSIS only);
  # its postinstall is not needed (docs/15, builds; ADR-115).
  electron-winstaller: false
  esbuild: false
  keytar: false
  lefthook: true
  msgpackr-extract: false
  native-keymap: true
  node-pty: true
  puppeteer: false
  # @playwright/test's postinstall would download browsers we do not use: the end-to-end tests drive
  # the app's own Electron, never a Playwright browser (docs/15).
  "@playwright/test": false
# The generated Theia application imports every Theia extension by name and expects them hoisted;
# pnpm's strict layout hides the ones that are only dependencies of other extensions (apps/desktop).
publicHoistPattern:
  - "@theia/*"
  - "@parcel/*"
  - "@vscode/ripgrep*"
  - "@vscode/windows-ca-certs"
  - drivelist
  - native-keymap
  - node-pty
  - reflect-metadata
  - trash
# docs/05: a release younger than 14 days MUST NOT be adopted (20160 minutes).
minimumReleaseAge: 20160
# Security overrides (the audit of 2026-10-23), each at least 14 days old as docs/05 requires:
# Electron >= 42.11.9 closes the sandbox, protocol-handler and code-cache advisories of 42.8.1 (Theia
# 1.76 pins 42.8.1 as a peer; a patch release of the same major is accepted); serialize-javascript
# >= 7.0.3 (mocha, through @theia/cli) closes an RCE in its deserializer. dompurify 3.4.17 (Theia's
# markdown view and monaco) closes a high advisory. undici 6.29.1 and 7.30.1 (2026-10-29 audit) close
# GHSA-qrxm-fqhp-jwvm on each major line without moving a dependent to the other major. markdown-it
# 14.3.3 (@theia/core, 2026-10-30 audit) closes GHSA-gfr2-rv44-r23c and GHSA-vfgh-jcmw-g37q.
# ip-address 10.7.4 and qs 6.16.1 (2026-10-30 audit) close GHSA-rxp7-6hxx-x8q5 and GHSA-6pq8-jhm2-2vcw
# under Theia: both through the MCP SDK v1 that @theia/ai-mcp still brings (METE's own packages left it,
# ADR-163), qs also through @theia/core's express and ip-address through @vscode/proxy-agent's socks.
# decompress (theia download:plugins, which unpacks the pinned built-ins at build time, ADR-103) has
# no fixed release.
# R1, 2026-11-08: exact fixes published before 2026-10-24T00:00:00Z (docs/05, 20160 minutes).
# Electron 42.11.16 closes GHSA-jr5w-w6x2-84p9; body-parser 1.20.9/2.4.0 close
# GHSA-27r3-jxmh-p828 without crossing majors; multer 2.5.0 closes GHSA-q7qp-rjg7-q26m.
# fast-uri 3.1.9 closes GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr and
# GHSA-xhq7-xmqj-769h; serialize-javascript 7.1.3 closes GHSA-m5mm-p8h7-m29v on its existing major.
# Eligibility and remaining blockers: docs/reviews/2026-11-07-release-security.md.
# These selections require the lead's lockfile/install and regression checks before verification.
# R3: only once 1.1.2 and uuid 7.0.3/8.3.2 pass bounded parent-consumer checks.
# diff 8.0.3 changes Mocha inline output and is not selected; see the R3 ledger.
# Evidence and remaining install gates: docs/reviews/2026-11-08-security-compatibility.md.
overrides:
  "@tootallnate/once@1.1.2": 2.0.1
  "body-parser@>=1.20.0 <1.20.9": 1.20.9
  "body-parser@>=2.0.0 <2.4.0": 2.4.0
  dompurify: 3.4.17
  electron: 42.11.16
  "fast-uri@>=3.0.0 <3.1.9": 3.1.9
  "follow-redirects@>=1.16.0 <1.16.2": 1.16.2
  "zod@<4.6.6": 4.6.7
  "ip-address@>=10.0.0 <10.7.4": 10.7.4
  "markdown-it@>=14.1.0 <14.3.3": 14.3.3
  "multer@>=2.0.0 <2.5.0": 2.5.0
  "qs@>=6.7.0 <6.16.1": 6.16.1
  serialize-javascript: 7.1.3
  "undici@<6.29.1": 6.29.1
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "uuid@7.0.3": 11.1.1
  "uuid@8.3.2": 11.1.1
# Drops SpectreMitigation from the proxy agent's binding.gyp so it compiles with the plain
# VS C++ Build Tools the Theia build already requires (ADR-103).
patchedDependencies:
  '@theia/task@1.76.0': patches/@theia__task@1.76.0.patch
  '@vscode/windows-ca-certs@0.3.4': patches/@vscode__windows-ca-certs@0.3.4.patch
  decompress@4.2.1: patches/decompress@4.2.1.patch
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
  diff@7.0.0: patches/diff@7.0.0.patch
  glob@10.5.0: patches/glob@10.5.0.patch
  minimatch@10.2.6: patches/minimatch@10.2.6.patch
  minimatch@9.0.9: patches/minimatch@9.0.9.patch
  # node-pty's binding.gyp asks for Spectre-mitigated libraries the plain VS C++ Build Tools lack;
  # @electron/rebuild compiles it for Electron's ABI during packaging, so the attribute goes as in
  # the proxy agent's patch (ADR-103, ADR-115).
  'node-pty@1.2.0-beta.12': patches/node-pty@1.2.0-beta.12.patch
# Advisories closed by the local patches above, not by a version (ADR-195). Scanners read only
# versions, so each id is listed here and in osv-scanner.toml, and scripts/test/vendor-hardening.test.mjs
# proves each fix against the installed patched code.
auditConfig:
  ignoreGhsas:
    - GHSA-mp2f-45pm-3cg9
    - GHSA-hrh2-vp3x-79xf
    - GHSA-h39j-r5qq-r9mm
    - GHSA-jwp9-9v96-94mx
    - GHSA-gcqx-w48m-w2h4
    - GHSA-73rr-hh4g-fpgx
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249
