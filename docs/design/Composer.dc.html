<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team panel — run composer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.mete.light{--bg:#ECEAF4;--panel:#F8F7FC;--line:#DAD6EA;--ink:#24223A;--muted:#6B6785;--accent:#5B4BD6;--good:#2FA38A;--warn:#E3A13A;--bad:#D9544A;--chip:#E4E0F3;--chrome:#DCD8EC;--side:#E6E3F2;--raised:#EFEDF8;--line-soft:#E2DEF0;--muted-2:#524E6E}
.mete.dark{--bg:#17162A;--panel:#211F38;--line:#34315A;--ink:#ECEAF7;--muted:#A6A2C4;--accent:#8F83F2;--good:#4CC3A6;--warn:#F0B75A;--bad:#EE7368;--chip:#2D2A4D;--chrome:#121122;--side:#1A192F;--raised:#1C1B32;--line-soft:#2A2848;--muted-2:#B9B5D6}
@keyframes mete-rise{from{opacity:0;transform:translateY(8px)}}
.mete .b-p:hover{background:color-mix(in srgb,var(--accent) 76%,var(--ink))!important;border-color:color-mix(in srgb,var(--accent) 76%,var(--ink))!important}
.mete .b-q:hover{background:var(--raised)!important;border-color:var(--muted)!important}
.mete .opt:hover{border-color:var(--muted)!important}
.mete button:focus-visible,.mete input:focus-visible,.mete textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.mete *{animation:none!important}}
</style>
</helmet>
<div class="mete light" style="width:1320px;height:850px;box-sizing:border-box;padding:20px;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:16px">

  <!-- Goal: the hero of the composer -->
  <header style="flex:none;background:var(--raised);border:1.5px solid var(--line);border-radius:16px;padding:24px 26px 26px">
    <h1 style="margin:0;font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-0.01em">Start a run</h1>
    <label for="goal" style="display:block;margin:14px 0 8px;font-size:15px;font-weight:700;line-height:1.3;color:var(--muted-2)">What should METE do in this folder?</label>
    <textarea id="goal" rows="4" style="display:block;width:100%;box-sizing:border-box;height:128px;resize:none;margin:0;padding:14px 18px;font:inherit;font-size:19px;font-weight:600;line-height:1.5;background:var(--panel);border:1.5px solid var(--accent);border-radius:14px;color:var(--ink);outline:3px solid color-mix(in srgb,var(--accent) 16%,transparent);outline-offset:0">Add a dark mode toggle to the settings page. Keep the choice in the user's settings file and follow the system theme until the user picks one.</textarea>
  </header>

  <!-- Columns -->
  <div style="flex:1;min-height:0;display:flex;gap:20px">

    <!-- Teams -->
    <main style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <h2 id="teams-title" style="margin:0;font-size:17px;font-weight:800;line-height:1.3">Which team should work on it?</h2>
        <button type="button" class="b-q" style="font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 11px;border-radius:10px;font-size:13.5px;font-weight:700;background:var(--panel);border:1.5px solid var(--line);color:var(--ink)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
          New team
        </button>
      </div>

      <div role="radiogroup" aria-labelledby="teams-title" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">

        <!-- Let METE choose -->
        <label class="opt" style="grid-column:1 / -1;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border:1.5px solid var(--line-soft);border-radius:14px;cursor:pointer">
          <input type="radio" name="mete-team" style="flex:none;margin:0;width:16px;height:16px;accent-color:var(--accent)">
          <span aria-hidden="true" style="flex:none;width:32px;height:32px;border-radius:10px;background:var(--chip);color:var(--muted-2);display:flex;align-items:center;justify-content:center">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"></circle><path d="M10.5 5.5L9 9 5.5 10.5 7 7z"></path></svg>
          </span>
          <span style="font-size:15px;font-weight:700;line-height:1.3">Let METE choose</span>
        </label>

        <!-- Game studio -->
        <div style="position:relative">
          <label class="opt" style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:14px 16px 15px;background:var(--panel);border:1.5px solid var(--line-soft);border-radius:14px;cursor:pointer">
            <span style="display:flex;align-items:center;gap:12px;padding-right:64px">
              <input type="radio" name="mete-team" style="flex:none;margin:0;width:16px;height:16px;accent-color:var(--accent)">
              <span aria-hidden="true" style="flex:none;width:32px;height:32px;border-radius:10px;background:var(--chip);color:var(--muted-2);display:flex;align-items:center;justify-content:center">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="4.5" width="12.5" height="7.5" rx="3.5"></rect><path d="M5 7v2.5M3.75 8.25h2.5"></path><path d="M10.25 7.5h.01M11.75 9h.01"></path></svg>
              </span>
              <span style="min-width:0;font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Game studio</span>
            </span>
            <span style="padding-left:28px;font-size:13.5px;font-weight:500;line-height:1.45;color:var(--muted-2)">Idea to playable prototype</span>
            <span style="margin-left:28px;padding-top:10px;border-top:1.5px solid var(--line-soft);display:flex;flex-wrap:wrap;align-items:center;gap:6px">
              <span style="margin-right:4px;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700">96 requests</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">groq 40</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">openrouter 30</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">opencode-zen 16</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:color-mix(in srgb,var(--warn) 45%,var(--ink));background:color-mix(in srgb,var(--warn) 14%,var(--panel));border-radius:999px;padding:1px 8px">10 unassigned</span>
              <span style="flex-basis:100%;font-size:12.5px;font-weight:500;line-height:1.4;color:var(--muted-2)">tasks the team adds come on top</span>
            </span>
          </label>
          <button type="button" class="b-q" style="position:absolute;top:13px;right:13px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--panel);border:1.5px solid var(--line);color:var(--ink)" aria-label="Edit Game studio">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"></path><path d="M9 4l3 3"></path></svg>
            Edit
          </button>
        </div>

        <!-- Research -->
        <div style="position:relative">
          <label class="opt" style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:14px 16px 15px;background:var(--panel);border:1.5px solid var(--line-soft);border-radius:14px;cursor:pointer">
            <span style="display:flex;align-items:center;gap:12px;padding-right:64px">
              <input type="radio" name="mete-team" style="flex:none;margin:0;width:16px;height:16px;accent-color:var(--accent)">
              <span aria-hidden="true" style="flex:none;width:32px;height:32px;border-radius:10px;background:var(--chip);color:var(--muted-2);display:flex;align-items:center;justify-content:center">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.25 3h4.25A1.5 1.5 0 018 4.5v8.75a1.5 1.5 0 00-1.5-1.5H2.25z"></path><path d="M13.75 3H9.5A1.5 1.5 0 008 4.5v8.75a1.5 1.5 0 011.5-1.5h4.25z"></path></svg>
              </span>
              <span style="min-width:0;font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Research</span>
            </span>
            <span style="padding-left:28px;font-size:13.5px;font-weight:500;line-height:1.45;color:var(--muted-2)">A topic becomes a cited report</span>
            <span style="margin-left:28px;padding-top:10px;border-top:1.5px solid var(--line-soft);display:flex;flex-wrap:wrap;align-items:center;gap:6px">
              <span style="margin-right:4px;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700">28 requests</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">groq 16</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">openrouter 12</span>
              <span style="flex-basis:100%;font-size:12.5px;font-weight:500;line-height:1.4;color:var(--muted-2)">tasks the team adds come on top</span>
            </span>
          </label>
          <button type="button" class="b-q" style="position:absolute;top:13px;right:13px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--panel);border:1.5px solid var(--line);color:var(--ink)" aria-label="Edit Research">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"></path><path d="M9 4l3 3"></path></svg>
            Edit
          </button>
        </div>

        <!-- SEO audit -->
        <div style="position:relative">
          <label class="opt" style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:14px 16px 15px;background:var(--panel);border:1.5px solid var(--line-soft);border-radius:14px;cursor:pointer">
            <span style="display:flex;align-items:center;gap:12px;padding-right:64px">
              <input type="radio" name="mete-team" style="flex:none;margin:0;width:16px;height:16px;accent-color:var(--accent)">
              <span aria-hidden="true" style="flex:none;width:32px;height:32px;border-radius:10px;background:var(--chip);color:var(--muted-2);display:flex;align-items:center;justify-content:center">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.75"></circle><path d="M10.5 10.5L14 14M5.25 8.5V7.5M7 8.5V5.5M8.75 8.5V6.5"></path></svg>
              </span>
              <span style="min-width:0;font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">SEO audit</span>
            </span>
            <span style="padding-left:28px;font-size:13.5px;font-weight:500;line-height:1.45;color:var(--muted-2)">A URL becomes a ranked list of fixes</span>
            <span style="margin-left:28px;padding-top:10px;border-top:1.5px solid var(--line-soft);display:flex;flex-wrap:wrap;align-items:center;gap:6px">
              <span style="margin-right:4px;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700">34 requests</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">groq 18</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">openrouter 6</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">nvidia 10</span>
              <span style="flex-basis:100%;font-size:12.5px;font-weight:500;line-height:1.4;color:var(--muted-2)">tasks the team adds come on top</span>
            </span>
          </label>
          <button type="button" class="b-q" style="position:absolute;top:13px;right:13px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--panel);border:1.5px solid var(--line);color:var(--ink)" aria-label="Edit SEO audit">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"></path><path d="M9 4l3 3"></path></svg>
            Edit
          </button>
        </div>

        <!-- Web development: selected -->
        <div style="position:relative;animation:mete-rise .5s cubic-bezier(.2,.7,.2,1) both">
          <label class="opt" style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:14px 16px 15px;background:color-mix(in srgb,var(--accent) 7%,var(--panel));border:1.5px solid var(--accent);border-radius:14px;cursor:pointer">
            <span style="display:flex;align-items:center;gap:12px;padding-right:64px">
              <input type="radio" name="mete-team" checked style="flex:none;margin:0;width:16px;height:16px;accent-color:var(--accent)">
              <span aria-hidden="true" style="flex:none;width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:color-mix(in srgb,var(--accent) 70%,var(--ink));display:flex;align-items:center;justify-content:center">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="2.5" width="12.5" height="11" rx="1.5"></rect><path d="M1.75 5.5h12.5M6.25 8.25L4.75 9.75l1.5 1.5M9.75 8.25l1.5 1.5-1.5 1.5"></path></svg>
              </span>
              <span style="min-width:0;font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Web development</span>
            </span>
            <span style="padding-left:28px;font-size:13.5px;font-weight:500;line-height:1.45;color:var(--muted-2)">A page described in a sentence becomes a built, audited site</span>
            <span style="margin-left:28px;padding-top:10px;border-top:1.5px solid color-mix(in srgb,var(--accent) 22%,var(--panel));display:flex;flex-wrap:wrap;align-items:center;gap:6px">
              <span style="margin-right:4px;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700">42 requests</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">groq 24</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">openrouter 12</span>
              <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">nvidia 6</span>
              <span style="flex-basis:100%;font-size:12.5px;font-weight:500;line-height:1.4;color:var(--muted-2)">tasks the team adds come on top</span>
            </span>
          </label>
          <button type="button" class="b-q" style="position:absolute;top:13px;right:13px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--panel);border:1.5px solid var(--line);color:var(--ink)" aria-label="Edit Web development">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"></path><path d="M9 4l3 3"></path></svg>
            Edit
          </button>
        </div>

        <!-- Single agent -->
        <label class="opt" style="grid-column:1 / -1;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border:1.5px solid var(--line-soft);border-radius:14px;cursor:pointer">
          <input type="radio" name="mete-team" style="flex:none;margin:0;width:16px;height:16px;accent-color:var(--accent)">
          <span aria-hidden="true" style="flex:none;width:32px;height:32px;border-radius:10px;background:var(--chip);color:var(--muted-2);display:flex;align-items:center;justify-content:center">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.5"></circle><path d="M3.5 13.5c.6-2.6 2.3-4 4.5-4s3.9 1.4 4.5 4"></path></svg>
          </span>
          <span style="flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.3">Single agent</span>
          <span style="flex:none;display:flex;align-items:center;gap:6px">
            <span style="margin-right:4px;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700">12 requests</span>
            <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:500;color:var(--muted-2);background:var(--chip);border-radius:999px;padding:1px 8px">groq 12</span>
          </span>
        </label>
      </div>
    </main>

    <!-- The chosen team's preferences, and Start -->
    <aside aria-labelledby="prefer-title" style="width:380px;flex:none;box-sizing:border-box;background:var(--side);border:1.5px solid var(--line-soft);border-radius:16px;padding:18px 18px 18px;display:flex;flex-direction:column;gap:14px">
      <div>
        <h2 id="prefer-title" style="margin:0;font-size:15px;font-weight:800;line-height:1.3">Preferred model (optional)</h2>
        <p style="margin:3px 0 0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.4;color:var(--muted-2)">providerId/modelId</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <label style="display:flex;flex-direction:column;gap:5px">
          <span style="font-size:13px;font-weight:700;line-height:1.3;color:var(--muted-2)">UI designer</span>
          <input placeholder="providerId/modelId" list="models-reasoning" aria-label="UI designer · Preferred model (optional)" style="box-sizing:border-box;height:36px;margin:0;padding:0 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;color:var(--ink)">
        </label>
        <label style="display:flex;flex-direction:column;gap:5px">
          <span style="font-size:13px;font-weight:700;line-height:1.3;color:var(--muted-2)">Frontend developer</span>
          <input placeholder="providerId/modelId" list="models-coder" value="groq/openai/gpt-oss-120b" aria-label="Frontend developer · Preferred model (optional)" style="box-sizing:border-box;height:36px;margin:0;padding:0 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;color:var(--ink)">
        </label>
        <label style="display:flex;flex-direction:column;gap:5px">
          <span style="font-size:13px;font-weight:700;line-height:1.3;color:var(--muted-2)">QA</span>
          <input placeholder="providerId/modelId" list="models-coder" aria-label="QA · Preferred model (optional)" style="box-sizing:border-box;height:36px;margin:0;padding:0 12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;color:var(--ink)">
